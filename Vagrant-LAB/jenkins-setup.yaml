---
- name: Deploy Jenkins using Docker
  hosts: jenkins-vm
  become: yes
  become_method: sudo
  
  tasks:
    - name: Create Jenkins data directory
      file:
        path: /var/jenkins_home
        state: directory
        owner: 1000
        group: 1000
        mode: '0755'
    
    - name: Pull Jenkins Docker image
      docker_image:
        name: jenkins/jenkins
        tag: lts-jdk21
        source: pull
    
    - name: Run Jenkins container
      docker_container:
        name: jenkins
        image: jenkins/jenkins:lts-jdk21
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "8080:8080"
          - "50000:50000"
        volumes:
          - /var/jenkins_home:/var/jenkins_home
        env:
          JENKINS_OPTS: "--httpPort=8080"
      register: jenkins_container_status
    
    - name: Wait for Jenkins to be ready
      uri:
        url: http://localhost:8080
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10
      ignore_errors: yes
    
    - name: Get Jenkins initial admin password
      command: docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_password
      ignore_errors: yes
    
    - name: Display Jenkins access information
      debug:
        msg:
          - "Jenkins is running at http://{{ ansible_host }}:8080"
          - "Initial admin password: {{ jenkins_password.stdout }}"
      when: jenkins_password.stdout is defined