---
- name: Deploy SonarQube using Docker
  hosts: all
  become: yes
  become_method: sudo
  
  tasks:
    - name: Create SonarQube data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: 1000
        group: 1000
        mode: '0755'
      loop:
        - /opt/sonarqube/data
        - /opt/sonarqube/extensions
        - /opt/sonarqube/logs
    
    - name: Set vm.max_map_count for Elasticsearch
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes
    
    - name: Set fs.file-max
      sysctl:
        name: fs.file-max
        value: '65536'
        state: present
        reload: yes
    
    - name: Pull SonarQube Docker image
      docker_image:
        name: sonarqube
        tag: latest
        source: pull
    
    - name: Run SonarQube container
      docker_container:
        name: sonarqube
        image: sonarqube:latest
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "9000:9000"
        volumes:
          - /opt/sonarqube/data:/opt/sonarqube/data
          - /opt/sonarqube/extensions:/opt/sonarqube/extensions
          - /opt/sonarqube/logs:/opt/sonarqube/logs
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      register: sonar_container_status
    
    - name: Wait for SonarQube to be ready
      uri:
        url: http://localhost:9000
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10
      ignore_errors: yes
    
    - name: Display SonarQube status
      debug:
        msg: "SonarQube is running at http://{{ ansible_host }}:9000"
    
    - name: Display default credentials
      debug:
        msg: 
          - "Default login credentials:"
          - "Username: admin"
          - "Password: admin"
          - "You will be prompted to change the password on first login"