---
- name: Deploy Nexus Repository Manager using Docker
  hosts: nexus-vm
  become: yes
  become_method: sudo
  
  tasks:
    - name: Create Nexus data directory
      file:
        path: /opt/nexus-data
        state: directory
        owner: 200
        group: 200
        mode: '0755'
    
    - name: Pull Nexus Docker image
      docker_image:
        name: sonatype/nexus3
        tag: latest
        source: pull
    
    - name: Run Nexus container
      docker_container:
        name: nexus
        image: sonatype/nexus3:latest
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "8081:8081"
        volumes:
          - /opt/nexus-data:/nexus-data
        env:
          INSTALL4J_ADD_VM_PARAMS: "-Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m"
      register: nexus_container_status
      
    - name: Wait for Nexus to be ready (this takes 2-3 minutes)
      uri:
        url: http://localhost:8081
        status_code: 200
      register: result
      until: result.status == 200
      retries: 60
      delay: 10
      ignore_errors: yes
    
    - name: Wait a bit more for admin password file to be created
      pause:
        seconds: 30
      when: result.status == 200
    
    - name: Get initial admin password
      command: docker exec nexus cat /nexus-data/admin.password
      register: nexus_password
      ignore_errors: yes
    
    - name: Display Nexus access information
      debug:
        msg:
          - "Nexus is running at http://{{ ansible_host }}:8081"
          - "Username: admin"
          - "Initial password: {{ nexus_password.stdout }}"
          - "IMPORTANT: Change the password on first login!"
          - "Note: If password is empty, wait 2-3 minutes for Nexus to fully start"
      when: nexus_container_status is succeeded